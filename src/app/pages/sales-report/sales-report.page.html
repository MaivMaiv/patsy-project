<ion-header>
  <ion-toolbar>
    <div class="menu-buttons1">
      <p slot="start" (click)="back()">Return</p>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
      <ion-row>
        <ion-col class="dashboard">
          <div >
            <ion-card class="employee-dashboard">
              <ion-card-header>
                <ion-card-title><h2>All Sales:</h2><h3>P {{allTotalSales}}.00</h3></ion-card-title>
              </ion-card-header>
            </ion-card>
          </div>
        </ion-col>
        <ion-col class="dashboard">
          <div >
            <ion-card class="employee-dashboard">
              <ion-card-header>
                <ion-card-title><h2>All Serves:</h2><h3>{{allTotalServes}} Customers</h3></ion-card-title>
              </ion-card-header>
            </ion-card>
          </div>
        </ion-col>
        <ion-col class="dashboard">
          <div>
            <ion-card class="employee-dashboard">
              <ion-card-header>
                <ion-card-title><h2>All Cost:</h2><h3>{{allTotalHours}} hrs</h3></ion-card-title>
              </ion-card-header>
            </ion-card>
          </div>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col>
          <div  class="card-checkout">
            <ion-card class="card-checkout">
              <ion-card-header><h1>Sales</h1></ion-card-header>
              <ion-card-content>
                <ngx-datatable
                class="material"
                [rows]="allRows"
                [columns]="allColumns"
                [columnMode]="'force'"
                [headerHeight]="50"
                [footerHeight]="50"
                [rowHeight]="'auto'"
              ></ngx-datatable>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
      </ion-row>
  </ion-grid>
</ion-content>
